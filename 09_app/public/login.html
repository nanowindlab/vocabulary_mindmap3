<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>로그인 · 어휘 마인드맵</title>
    <style>
      :root { color-scheme: dark; font-family: "SUIT Variable", "Pretendard Variable", "Apple SD Gothic Neo", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #edf3fb;
        background: radial-gradient(circle at 15% 10%, rgba(88,166,255,.17), transparent 35%),
          radial-gradient(circle at 85% 85%, rgba(188,140,255,.12), transparent 35%), #081018; }
      main { width: min(100%, 430px); padding: 36px; border: 1px solid rgba(167,186,209,.18); border-radius: 24px;
        background: rgba(15,24,34,.93); box-shadow: 0 24px 80px rgba(0,0,0,.3); }
      .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px;
        color: #58a6ff; font-size: 27px; background: rgba(88,166,255,.15); }
      h1 { margin: 22px 0 10px; font-size: 25px; }
      p { color: #a8b7c8; line-height: 1.65; margin: 0 0 24px; }
      .purpose { margin-bottom: 10px; }
      .privacy { font-size: 13px; color: #8e9eaf; }
      a { display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; padding: 12px 16px;
        border: 1px solid #747775; border-radius: 12px; background: #fff; color: #1f1f1f;
        text-decoration: none; font-size: 14px; font-weight: 600; }
      a:hover { background: #f2f2f2; }
      a[aria-disabled="true"] { opacity: .45; pointer-events: none; }
      .links { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
      .links a { display: inline; width: auto; padding: 0; border: 0; background: transparent; color: #a8b7c8; font-size: 12px; font-weight: 400; }
      .links a:hover { background: transparent; color: #edf3fb; text-decoration: underline; }
      .google-mark { display: grid; place-items: center; width: 22px; height: 22px; background: #fff; }
      .google-mark img { display: block; width: 18px; height: 18px; }
      #message { min-height: 24px; margin: 16px 0 0; font-size: 13px; color: #ffb4aa; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">◎</div>
      <h1>어휘 마인드맵</h1>
      <p class="purpose">의미 범주와 주제·상황을 따라 한국어 어휘를 탐색하는 학습 도구입니다.</p>
      <p class="privacy">Gmail 주소(@gmail.com)만 사용할 수 있습니다. 계정 정보는 로그인 확인과 계정 표시에만 사용하며 메일은 읽지 않습니다.</p>
      <a id="login" href="/api/auth/start" aria-disabled="true"><span class="google-mark"><img src="https://developers.google.com/static/identity/images/g-logo.png" alt="" /></span>Google 계정으로 로그인</a>
      <nav class="links" aria-label="서비스 정보"><a href="/about.html">앱 소개</a><a href="/privacy.html">개인정보처리방침</a><a href="/terms.html">이용약관</a></nav>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script>
      const login = document.getElementById("login");
      const message = document.getElementById("message");
      const authResult = new URLSearchParams(location.search).get("auth");
      if (authResult === "cancelled") message.textContent = "로그인이 취소되었습니다.";
      if (authResult === "failed") message.textContent = "로그인을 완료하지 못했습니다. 다시 시도해 주세요.";
      if (authResult === "forbidden") message.textContent = "이 계정에는 앱 접근 권한이 없습니다.";
      fetch("/api/auth/session", { credentials: "same-origin", cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error("session_unavailable");
          return response.json();
        })
        .then((session) => {
          if (session.user) {
            location.replace("/");
          } else if (session.configured) {
            login.removeAttribute("aria-disabled");
          } else {
            message.textContent = "로그인 설정이 아직 완료되지 않았습니다.";
          }
        })
        .catch(() => { message.textContent = "로그인 상태를 확인할 수 없습니다. 페이지를 새로고침해 주세요."; });
    </script>
  </body>
</html>
